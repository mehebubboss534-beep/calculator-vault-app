
name: Build Calculator Vault APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        run: flutter create --platforms=android .

      - name: Fix Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]

          found = False

          for file in files:
              if file.exists():
                  found = True
                  content = file.read_text()
                  content, count = re.subn(
                      r'(?m)^(\s*compileSdk\s*(?:=\s*)?).*$',
                      lambda m: m.group(1) + '36',
                      content
                  )
                  file.write_text(content)
                  print(f"Updated {file}, changes: {count}")

          if not found:
              raise SystemExit("Android Gradle file not found")

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Vault-APK
          path: build/app/outputs/flutter-apk/app-release.apk
