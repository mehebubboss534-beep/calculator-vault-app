name: Build Calculator Vault APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Fix compileSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          roots = [
              Path("android"),
              Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache")))
          ]

          for root in roots:
              if not root.exists():
                  continue

              for pattern in ("**/build.gradle", "**/build.gradle.kts"):
                  for file in root.glob(pattern):
                      try:
                          content = file.read_text()
                          updated = re.sub(
                              r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?).*$',
                              lambda m: m.group(1) + "36",
                              content
                          )
                          file.write_text(updated)
                      except (OSError, UnicodeError):
                          pass

          app_files = list(Path("android/app").glob("build.gradle*"))

          if not app_files:
              raise SystemExit("App Gradle file not found")

          if not any(
              re.search(
                  r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\s*$',
                  f.read_text()
              )
              for f in app_files
          ):
              raise SystemExit("App compileSdk 36 not verified")

          print("compileSdk 36 verified")
          PY

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x :video_player_android:lintVitalAnalyzeRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Vault-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
          
