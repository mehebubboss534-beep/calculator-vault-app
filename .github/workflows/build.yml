
name: Build Calculator Vault APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Fix compileSdk for app and plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          roots = [
              Path("android"),
              Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache")))
          ]

          changed = []

          for root in roots:
              if not root.exists():
                  continue

              for pattern in ("**/build.gradle", "**/build.gradle.kts"):
                  for file in root.glob(pattern):
                      try:
                          content = file.read_text()
                          updated, count = re.subn(
                              r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?).*$',
                              lambda m: m.group(1) + "36",
                              content
                          )

                          if count:
                              file.write_text(updated)
                              changed.append(str(file))
                      except (OSError, UnicodeError):
                          pass

          print("Updated Gradle files:")
          for file in changed:
              print(file)

          app = Path("android/app")
          candidates = list(app.glob("build.gradle*"))

          if not candidates:
              raise SystemExit("App Gradle file not found")

          for file in candidates:
              content = file.read_text()
              if not re.search(r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\s*$', content):
                  raise SystemExit(f"compileSdk 36 not verified in {file}")

          print("App compileSdk 36 verified.")
          PY
                - name: Build Release APK
        run: flutter build apk --release -x lintVitalAnalyzeRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Vault-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
