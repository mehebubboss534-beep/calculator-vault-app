name: calculator_vault
description: Private photo and video vault with encrypted local storage.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  local_auth: ^2.3.0
  video_player: ^2.9.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
